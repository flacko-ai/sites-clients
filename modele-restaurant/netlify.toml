# Configuration Netlify d'un client.
# Sur Netlify, le « Base directory » du projet doit être : clients/<dossier-du-client>
# Le site est déjà généré dans public/ : aucune commande de build n'est nécessaire.

[build]
  publish = "public"
  command = "echo 'Site statique déjà généré, rien à construire.'"
  # Ne republier ce client que si SON dossier a changé (économise les crédits Netlify).
  # Code de sortie 0 = on annule la publication ; 1 = on publie.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
